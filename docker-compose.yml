version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: idea_validator_db
    restart: always
    environment:
      POSTGRES_DB: idea_validator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
